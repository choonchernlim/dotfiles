# Global tool versions managed by mise (live-symlinked - edits apply
# immediately; run `mise install` or `rebuild work` to fetch new versions).
# Per-project overrides: .mise.toml, .nvmrc, .java-version, or .sdkmanrc.

[tools]
java = "temurin-25"  # latest Temurin 25 patch; projects can override it
node = "lts"         # replaces nvm; mise also honors per-project .nvmrc
terraform = "1.7.4"  # from TFENV_TERRAFORM_VERSION in the retired tfenv.sh

[settings]
# mise 2025+ ignores idiomatic version files unless opted in. Preserve .nvmrc
# behavior and honor Java projects that pin a JDK via .java-version/.sdkmanrc.
idiomatic_version_file_enable_tools = ["java", "node"]
# herdr checks out worktrees under ~/.herdr/worktrees, outside the repo roots,
# so each new worktree's .mise.toml would otherwise prompt for `mise trust`.
# ~/Documents/development stays until every host has made the dev root move
# (docs/gotchas.md), so an unmoved host keeps its trust meanwhile.
trusted_config_paths = ["~/Developer", "~/Documents/development", "~/.herdr/worktrees"]
